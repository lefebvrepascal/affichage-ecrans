<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affichage – Console</title>
<style>
  :root{
    --bg:#f3f5f8; --panel:#fff; --ink:#152238; --muted:#66748a; --line:#e2e7ef;
    --brand:#1d3557; --brand2:#264b73; --accent:#e9853a; --ok:#2a9d68; --bad:#d64045; --soft:#eef2f8;
    --r:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:24px;padding:0 24px;height:60px;position:sticky;top:0;z-index:10}
  header .logo{font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
  header .logo i{width:28px;height:20px;border:3px solid var(--accent);border-radius:4px;display:inline-block;position:relative}
  header .logo i:after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:3px;background:var(--accent);transform:translateX(-50%)}
  nav{display:flex;gap:4px;overflow-x:auto}
  nav button{background:none;border:0;color:#c9d6ea;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:600}
  nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  nav button.on{background:rgba(255,255,255,.16);color:#fff}
  nav button .badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:6px}
  header .sp{flex:1}
  header .out{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
  main{max-width:1240px;margin:0 auto;padding:24px}
  h2{margin:0 0 4px;font-size:22px}
  .sub{color:var(--muted);margin:0 0 20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
  .panel h3{margin:0 0 12px;font-size:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:160px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
  label.f > *{color:var(--ink);font-weight:400}
  input[type=text],input[type=password],input[type=number],input[type=url],input[type=time],select,textarea{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:2px solid #9bb8e0;border-color:#9bb8e0}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand2)}
  .btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--bad);border-color:#f0c7c9}
  .btn.danger:hover{background:#fdeeee}
  .btn.big{padding:12px 20px;font-size:16px}
  .btn.sm{padding:4px 9px;font-size:13px}
  .muted{color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#b8c1cf;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(42,157,104,.2)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
  .chip b{font-size:15px;letter-spacing:.08em;color:var(--brand)}
  code.url{background:var(--soft);padding:3px 8px;border-radius:6px;font-size:14px;user-select:all}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
  .thumb{aspect-ratio:16/9;background:#0e1a2b;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
  .thumb .tt{padding:10px 14px;font-weight:800;font-size:15px;line-height:1.2;text-align:left;width:100%}
  .thumb .ic{font-size:34px;opacity:.85}
  .type{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
  .card .meta{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .meta .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .meta .act{display:flex;gap:6px;margin-top:auto}

  .drop{border:2px dashed #b8c7dc;border-radius:var(--r);padding:26px;text-align:center;background:#f8fafd;cursor:pointer;transition:.15s}
  .drop.over{border-color:var(--accent);background:#fff6ee}
  .prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
  .prog div{height:100%;width:0;background:var(--accent);transition:width .2s}

  /* Écrans */
  .scr{display:grid;grid-template-columns:1fr;gap:16px}
  .scard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .scard .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .scard .hd .nm{font-size:17px;font-weight:800}
  .scard .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .rules{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .rule{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);padding:8px 10px;border-radius:8px;margin-bottom:6px}
  .rule select{width:auto;min-width:150px}
  .rule input[type=time]{width:auto}
  .days{display:flex;gap:3px}
  .days label{cursor:pointer}
  .days input{display:none}
  .days span{display:inline-block;width:30px;text-align:center;padding:4px 0;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
  .days input:checked + span{background:var(--brand);border-color:var(--brand);color:#fff}

  /* Playlists */
  .pl{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
  .pllist .it{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .pllist .it:hover{background:var(--soft)}
  .pllist .it.on{background:var(--brand);color:#fff}
  .pllist .it.on .muted{color:#c9d6ea}
  .items .itm{display:grid;grid-template-columns:28px 88px 1fr 120px auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  .items .itm .n{font-weight:700;color:var(--muted);text-align:center}
  .items .mini{width:88px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#0e1a2b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .items .mini img,.items .mini video{width:100%;height:100%;object-fit:cover}
  .items .itm .dur{display:flex;align-items:center;gap:6px}
  .items .itm .dur input{width:70px}
  .lib{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
  .lib .li{flex:0 0 140px;cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .lib .li:hover{border-color:var(--accent)}
  .lib .li .mini{width:100%;aspect-ratio:16/9;background:#0e1a2b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
  .lib .li .mini img,.lib .li .mini video{width:100%;height:100%;object-fit:cover}
  .lib .li div.l{padding:6px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Alerte */
  .alertOn{background:#b00020;color:#fff;border-radius:var(--r);padding:18px 20px;display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .alertOn.info{background:#e76f00}
  .alertOn .t{flex:1;min-width:240px}
  .alertOn h3{margin:0 0 4px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

  /* Modale */
  .ov{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px}
  .modal h3{margin:0 0 16px;font-size:19px}
  .modal .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .prev{aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center;padding:6% 8%;margin-top:12px}
  .prev .bar{width:14%;height:5px;border-radius:4px;margin-bottom:6%}
  .prev .h{font-weight:800;font-size:clamp(16px,3.4vw,30px);line-height:1.1;margin-bottom:3%}
  .prev .b{font-size:clamp(11px,1.8vw,16px);white-space:pre-line;opacity:.9}
  .colors{display:flex;gap:12px}
  .colors input[type=color]{width:46px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.err{background:var(--bad)}
  .empty{text-align:center;color:var(--muted);padding:30px}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f2440,#1d3557 60%,#264b73)}
  #login form{background:#fff;padding:30px;border-radius:16px;width:340px;display:flex;flex-direction:column;gap:14px}
  #login h1{margin:0;font-size:22px}
  @media (max-width:820px){
    .pl{grid-template-columns:1fr}
    .items .itm{grid-template-columns:24px 64px 1fr;grid-auto-rows:auto}
    .items .itm .dur,.items .itm .ops{grid-column:2/-1}
    .modal .two{grid-template-columns:1fr}
    header{gap:10px;padding:0 12px}
    header .logo span{display:none}
  }
</style>
</head>
<body>

<div id="login" style="display:none">
  <form id="loginForm">
    <h1>Affichage</h1>
    <div class="muted">Console d'administration des écrans</div>
    <label class="f">Identifiant<input type="text" id="lg" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex. direction" required></label>
    <label class="f">Mot de passe<input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="btn pri big" type="submit">Se connecter</button>
    <div id="loginErr" style="color:var(--bad);display:none"></div>
  </form>
  <form id="setupForm" style="display:none;width:400px">
    <h1>Installation</h1>
    <div class="muted">Première utilisation : créez le compte administrateur. Vous pourrez ensuite ajouter d'autres personnes.</div>
    <label class="f">Nom de l'établissement<input type="text" id="suSchool" required placeholder="ex. Collège Saint-Exemple"></label>
    <label class="f">Votre nom<input type="text" id="suName" required placeholder="ex. Marie Dupont"></label>
    <label class="f">Identifiant de connexion<input type="text" id="suLogin" required autocapitalize="none" spellcheck="false" placeholder="ex. direction"></label>
    <label class="f">Mot de passe (8 caractères minimum)<input type="password" id="suPw" required autocomplete="new-password"></label>
    <label class="f">Confirmer le mot de passe<input type="password" id="suPw2" required autocomplete="new-password"></label>
    <label class="f" id="suCodeWrap" style="display:none">Code d'installation<input type="text" id="suCode" autocomplete="off"></label>
    <button class="btn pri big" type="submit">Créer le compte et commencer</button>
    <div id="setupErr" style="color:var(--bad);display:none"></div>
  </form>
</div>

<div id="app" style="display:none">
  <header>
    <div class="logo"><i></i><span id="brand">Affichage</span></div>
    <nav id="nav">
      <button data-tab="screens">Écrans</button>
      <button data-tab="contents">Contenus</button>
      <button data-tab="playlists">Playlists</button>
      <button data-tab="alert">Alerte</button>
      <button data-tab="settings">Réglages &amp; aide</button>
    </nav>
    <div class="sp"></div>
    <span id="whoami" style="color:#c9d6ea;font-size:14px;white-space:nowrap"></span>
    <button class="out" id="logout">Déconnexion</button>
  </header>
  <main id="main"></main>
</div>

<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  let token = store.get('sc_admin_token') || '';
  let S = null;              // état complet renvoyé par le serveur
  let tab = store.get('sc_tab') || 'screens';
  let selPl = null;          // playlist sélectionnée
  let plDraft = null;        // brouillon d'édition de playlist

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAYS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const TYPES = { image: 'Image', video: 'Vidéo', text: 'Annonce', web: 'Page web', youtube: 'YouTube', clock: 'Horloge', slides: 'Diaporama' };
  const ICONS = { web: '🌐', youtube: '▶', clock: '🕒', video: '🎬', image: '🖼', slides: '📊' };
  const nSlides = c => (c && c.slides ? c.slides.length : 0);

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
  }

  /* Confirmation intégrée à la page (les boîtes confirm() du navigateur peuvent être bloquées) */
  function ask(title, detail, okLabel) {
    return new Promise(resolve => {
      const ov = document.createElement('div'); ov.className = 'ov';
      ov.innerHTML = `<div class="modal" style="max-width:460px" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>${detail ? `<p class="muted" style="margin-top:0">${esc(detail)}</p>` : ''}
        <div class="ft"><button class="btn" data-no>Annuler</button><button class="btn pri" data-yes>${esc(okLabel || 'Confirmer')}</button></div></div>`;
      const done = v => { ov.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      const onKey = e => { if (e.key === 'Escape') done(false); };
      ov.querySelector('[data-no]').onclick = () => done(false);
      ov.querySelector('[data-yes]').onclick = () => done(true);
      ov.addEventListener('click', e => { if (e.target === ov) done(false); });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(ov);
      ov.querySelector('[data-yes]').focus();
    });
  }

  async function api(method, url, body) {
    const r = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
      body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 401) { showLogin(); throw new Error('Session expirée'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Erreur ' + r.status);
    return d;
  }
  const run = async (fn, ok) => { try { await fn(); if (ok) toast(ok); } catch (e) { toast(e.message, true); } };

  async function load() { S = await api('GET', '/api/state'); }
  async function refresh() { await load(); render(); }

  /* ---------------- Connexion ---------------- */
  function showLogin() {
    $('#app').style.display = 'none'; $('#login').style.display = 'flex';
    $('#setupForm').style.display = 'none'; $('#loginForm').style.display = 'flex';
    $('#lg').value = store.get('sc_login') || '';
    ($('#lg').value ? $('#pw') : $('#lg')).focus();
  }
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login: $('#lg').value, password: $('#pw').value }) });
    const d = await r.json();
    if (!r.ok) { $('#loginErr').textContent = d.error; $('#loginErr').style.display = 'block'; return; }
    token = d.token; store.set('sc_admin_token', token); store.set('sc_login', $('#lg').value.trim().toLowerCase()); $('#pw').value = ''; $('#loginErr').style.display = 'none'; start();
  };
  /* Premier lancement : formulaire d'installation */
  async function checkSetup() {
    try {
      const d = await (await fetch('/api/setup')).json();
      if (!d.needsSetup) return false;
      $('#app').style.display = 'none'; $('#login').style.display = 'flex';
      $('#loginForm').style.display = 'none'; $('#setupForm').style.display = 'flex';
      $('#suCodeWrap').style.display = d.codeRequired ? 'flex' : 'none';
      $('#suSchool').focus();
      return true;
    } catch (e) { return false; }
  }
  $('#suName').oninput = () => {
    if ($('#suLogin').dataset.touched) return;
    $('#suLogin').value = ($('#suName').value.trim().split(/\s+/)[0] || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9._-]/g, '');
  };
  $('#suLogin').oninput = () => { $('#suLogin').dataset.touched = '1'; };
  $('#setupForm').onsubmit = async e => {
    e.preventDefault();
    const show = m => { $('#setupErr').textContent = m; $('#setupErr').style.display = 'block'; };
    if ($('#suPw').value !== $('#suPw2').value) return show('Les deux mots de passe sont différents');
    const r = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      schoolName: $('#suSchool').value, name: $('#suName').value, login: $('#suLogin').value, password: $('#suPw').value, code: $('#suCode').value }) });
    const d = await r.json();
    if (!r.ok) { if (r.status === 409) { showLogin(); } return show(d.error); }
    token = d.token; store.set('sc_admin_token', token); store.set('sc_login', d.user.login);
    $('#setupForm').style.display = 'none'; $('#loginForm').style.display = 'flex';
    start();
  };

  $('#logout').onclick = () => { token = ''; store.del('sc_admin_token'); showLogin(); };

  async function changePassword(nw) {
    const d = await api('POST', '/api/password', { password: nw });
    token = d.token; store.set('sc_admin_token', token);
  }

  function forcePasswordChange() {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="modal" style="max-width:440px">
      <h3>Choisissez votre mot de passe</h3>
      <p class="muted" style="margin-top:0">Bonjour ${esc(S.me ? S.me.name : '')}. Votre mot de passe est provisoire : la console étant accessible sur Internet, choisissez-en un personnel avant de commencer.</p>
      <label class="f">Nouveau mot de passe (8 caractères minimum)<input type="password" id="np1" autocomplete="new-password"></label>
      <label class="f" style="margin-top:10px">Confirmer<input type="password" id="np2" autocomplete="new-password"></label>
      <div class="ft"><button class="btn pri" id="npOk">Enregistrer</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#np1').focus();
    ov.querySelector('#npOk').onclick = () => {
      const a = ov.querySelector('#np1').value, b = ov.querySelector('#np2').value;
      if (a !== b) return toast('Les deux saisies sont différentes', true);
      run(async () => { await changePassword(a); ov.remove(); await refresh(); }, 'Mot de passe enregistré');
    };
  }

  async function start() {
    try { await load(); } catch (e) { return; }
    $('#login').style.display = 'none'; $('#app').style.display = 'block';
    render();
    if (S.me && S.me.mustChange) forcePasswordChange();
  }

  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; store.set('sc_tab', tab); render(); });

  /* Rafraîchissement léger de l'état des écrans */
  setInterval(async () => {
    if (!token || $('#app').style.display === 'none') return;
    try {
      const old = S; await load();
      document.querySelectorAll('[data-online]').forEach(el => {
        const s = S.screens.find(x => x.id === el.dataset.online);
        if (s) { el.classList.toggle('on', s.online); const lab = el.nextElementSibling; if (lab) lab.textContent = statusText(s); }
      });
      if (tab === 'screens' && (JSON.stringify(old.pending) !== JSON.stringify(S.pending) || old.screens.length !== S.screens.length)) {
        renderPending();
        if (old.screens.length !== S.screens.length) render();
      }
      updateNav();
    } catch (e) {}
  }, 20000);

  function updateNav() {
    document.querySelectorAll('#nav button').forEach(b => {
      b.classList.toggle('on', b.dataset.tab === tab);
      if (b.dataset.tab === 'screens') b.innerHTML = 'Écrans' + (S.pending.length ? `<span class="badge">${S.pending.length}</span>` : '');
      if (b.dataset.tab === 'alert') b.innerHTML = 'Alerte' + (S.alert ? '<span class="badge">EN COURS</span>' : '');
    });
  }

  function render() {
    updateNav();
    $('#whoami').textContent = S.me ? S.me.name : '';
    $('#brand').textContent = S.settings.schoolName ? 'Affichage · ' + S.settings.schoolName : 'Affichage';
    document.title = 'Affichage – ' + (S.settings.schoolName || 'Console');
    const m = $('#main');
    if (tab === 'screens') m.innerHTML = viewScreens();
    else if (tab === 'contents') m.innerHTML = viewContents();
    else if (tab === 'playlists') m.innerHTML = viewPlaylists();
    else if (tab === 'alert') m.innerHTML = viewAlert();
    else m.innerHTML = viewSettings();
    bind();
  }

  /* ---------------- Vignettes ---------------- */
  function thumb(c, cls) {

  /* Réduit les grandes photos JPEG (> 2560 px ou > 2 Mo) pour accélérer l'affichage sur les TV */
  async function shrinkImage(file) {
    if (!/^image\/jpe?g$/.test(file.type) || file.size < 2 * 1024 * 1024) return file;
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 2560 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88));
      return blob && blob.size < file.size ? new File([blob], file.name, { type: 'image/jpeg' }) : file;
    } catch (e) { return file; }
  }

  let uploading = false;

  /* Envoi d'un fichier en morceaux de 3 Mo ; onPart(fraction) pour la progression */
  async function sendBlob(file, name, extra, onPart) {
    const init = await api('POST', '/api/upload/init', { mime: file.type, size: file.size });
    for (let n = 0; n < init.chunks; n++) {
      const part = file.slice(n * init.chunkSize, (n + 1) * init.chunkSize);
      let tries = 0;
      for (;;) {
        const r = await fetch(`/api/upload/${init.id}/${n}`, { method: 'PUT', headers: { 'x-admin-token': token, 'Content-Type': 'application/octet-stream' }, body: part });
        if (r.status === 401) { showLogin(); throw new Error('Session expirée'); }
        if (r.ok) break;
        if (++tries >= 3) throw new Error('Échec de l\'envoi de « ' + name + ' »');
        await new Promise(res => setTimeout(res, 1500));
      }
      if (onPart) onPart((n + 1) / init.chunks);
    }
    return api('POST', `/api/upload/${init.id}/done`, Object.assign({ name, mime: file.type, size: file.size }, extra || {}));
  }

  /* pdf.js est chargé seulement quand on importe un PDF */
  let pdfjsReady = null;
  function loadPdfJs() {
    if (!pdfjsReady) pdfjsReady = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = '/vendor/pdfjs/pdf.min.js';
      sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.js'; resolve(window.pdfjsLib); };
      sc.onerror = () => { pdfjsReady = null; reject(new Error('Impossible de charger le lecteur PDF')); };
      document.head.appendChild(sc);
    });
    return pdfjsReady;
  }

  /* PDF → une image JPEG par page (1920 px sur le grand côté) → contenu « Diaporama » */
  async function importPdf(file, setProgress) {
    const pdfjs = await loadPdfJs();
    let doc;
    try { doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise; }
    catch (e) { throw new Error(`« ${file.name} » n'est pas un PDF lisible` + (e && e.name === 'PasswordException' ? ' (protégé par mot de passe)' : '')); }
    const total = Math.min(doc.numPages, 200);
    if (doc.numPages > 200) toast('Seules les 200 premières pages seront importées', true);
    const ids = [];
    for (let i = 1; i <= total; i++) {
      setProgress((i - 1) / total, `Diapositive ${i} / ${total} de « ${file.name} »`);
      const page = await doc.getPage(i);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = 1920 / Math.max(vp1.width, vp1.height);
      const vp = page.getViewport({ scale });
      const cv = document.createElement('canvas');
      cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
      page.cleanup();
      const img = new File([blob], `diapo-${i}.jpg`, { type: 'image/jpeg' });
      const r = await sendBlob(img, img.name, { slide: true }, f => setProgress((i - 1 + f) / total, `Diapositive ${i} / ${total} de « ${file.name} »`));
      ids.push(r.id);
    }
    doc.destroy();
    return api('POST', '/api/contents', { type: 'slides', name: file.name.replace(/\.pdf$/i, ''), mediaIds: ids, duration: 10 });
  }

  async function uploadFiles(fileList) {
    const all = [...fileList];
    const isPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    const isPres = f => /\.(pptx?|key|odp)$/i.test(f.name);
    if (all.some(isPres)) toast('PowerPoint / Keynote : exportez d\'abord la présentation en PDF, puis déposez le PDF', true);
    const files = all.filter(f => isPdf(f) || /^(image|video)\//.test(f.type));
    if (!files.length) return all.some(isPres) ? undefined : toast('Aucun fichier image, vidéo ou PDF reconnu', true);
    if (uploading) return toast('Un envoi est déjà en cours', true);
    uploading = true;
    const prog = $('#prog'), bar = prog.firstElementChild, label = $('#progLabel');
    prog.style.display = 'block';
    let ok = 0, decks = 0;
    try {
      for (let fi = 0; fi < files.length; fi++) {
        const setProgress = (f, txt) => {
          const pct = ((fi + f) / files.length) * 100;
          bar.style.width = pct + '%';
          if (label) label.textContent = `${txt} — ${Math.round(pct)} %`;
        };
        if (isPdf(files[fi])) {
          const c = await importPdf(files[fi], setProgress);
          decks++; toast(`Diaporama « ${c.name} » ajouté (${nSlides(c)} diapositives)`);
          continue;
        }
        const file = await shrinkImage(files[fi]);
        if (file.size > 300 * 1024 * 1024) { toast(`« ${file.name} » dépasse 300 Mo`, true); continue; }
        await sendBlob(file, file.name, null, f => setProgress(f, `Envoi de « ${file.name} »`));
        ok++;
      }
      if (ok) toast(ok + ' fichier(s) ajouté(s)' + (decks ? ` et ${decks} diaporama(s)` : ''));
    } catch (e) { toast(e.message, true); }
    uploading = false;
    prog.style.display = 'none'; bar.style.width = '0';
    if (label) label.textContent = '';
    refresh();
  }

    if (c.type === 'slides') body += `
      <div class="lib" style="margin-top:12px">${c.slides.map((f, i) => `<div class="li" style="cursor:default"><div class="mini"><img loading="lazy" src="${esc(f)}" alt=""></div><div class="l">Diapo ${i + 1}</div></div>`).join('')}</div>`;
    if (c.type === 'image' || c.type === 'video' || c.type === 'slides') body += `
      <div class="two" style="margin-top:10px">
        <label class="f">Cadrage<select id="cFit"><option value="contain" ${c.fit !== 'cover' ? 'selected' : ''}>Entier (bandes noires si besoin)</option><option value="cover" ${c.fit === 'cover' ? 'selected' : ''}>Remplir l'écran (rogné)</option></select></label>
        ${c.type === 'video' ? `<label class="f">Son<select id="cMuted"><option value="1" ${c.muted !== false ? 'selected' : ''}>Coupé</option><option value="0" ${c.muted === false ? 'selected' : ''}>Activé (si l'écran l'autorise)</option></select></label>` : '<div></div>'}
      </div>`;
    body += `<label class="f" style="margin-top:10px;max-width:300px">${c.type === 'slides' ? 'Durée de chaque diapositive (secondes)' : 'Durée d\'affichage par défaut (secondes)'}${c.type === 'video' ? ' — 0 = toute la vidéo' : ''}
      <input type="number" id="cDur" min="0" value="${c.duration != null ? c.duration : 15}"></label>`;
    ov.innerHTML = `<div class="modal"><h3>${isNew ? 'Nouveau contenu' : 'Modifier'} · ${TYPES[c.type]}</h3>${body}
      <div class="ft"><button class="btn" data-x>Annuler</button><button class="btn pri" data-ok>${isNew ? 'Créer' : 'Enregistrer'}</button></div></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    ov.querySelector('[data-x]').onclick = close;
    const prev = () => {
      const p = ov.querySelector('#cPrev'); if (!p) return;
      p.style.background = ov.querySelector('#cBg').value; p.style.color = ov.querySelector('#cFg').value;
      p.innerHTML = `<div class="bar" style="background:${esc(ov.querySelector('#cAc').value)}"></div><div class="h">${esc(ov.querySelector('#cTitle').value)}</div><div class="b">${esc(ov.querySelector('#cBody').value)}</div>`;
    };
    ov.querySelectorAll('input,textarea').forEach(i => i.addEventListener('input', prev));
    ov.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => {
      const [bg, fg, ac] = b.dataset.theme.split(',');
      ov.querySelector('#cBg').value = bg; ov.querySelector('#cFg').value = fg; ov.querySelector('#cAc').value = ac; prev();
    });
    prev();
    ov.querySelector('[data-ok]').onclick = () => run(async () => {
      const v = id => { const el = ov.querySelector(id); return el ? el.value : undefined; };
      const data = { type: c.type, name: v('#cName') || (v('#cTitle') || TYPES[c.type]), duration: Number(v('#cDur')) };
      if (c.type === 'text') Object.assign(data, { title: v('#cTitle'), body: v('#cBody'), bg: v('#cBg'), fg: v('#cFg'), accent: v('#cAc') });
      if (c.type === 'web' || c.type === 'youtube') data.url = v('#cUrl');
      if (c.type === 'image' || c.type === 'video' || c.type === 'slides') { data.fit = v('#cFit'); if (c.type === 'video') data.muted = v('#cMuted') === '1'; }
      if (isNew) await api('POST', '/api/contents', data); else await api('PUT', '/api/contents/' + c.id, data);
      close(); await refresh();
    }, isNew ? 'Contenu créé' : 'Contenu mis à jour');
    const first = ov.querySelector('#cTitle') || ov.querySelector('#cUrl') || ov.querySelector('#cName'); if (first) first.focus();
  }

  /* ================= PLAYLISTS ================= */
  function viewPlaylists() {
    if (!selPl || !plById(selPl)) selPl = S.playlists[0] && S.playlists[0].id;
    const p = plById(selPl);
    if (p && (!plDraft || plDraft.id !== p.id)) plDraft = JSON.parse(JSON.stringify(p));
    const usedBy = p ? S.screens.filter(s => s.playlistId === p.id || (s.schedules || []).some(r => r.playlistId === p.id)) : [];
    const total = plDraft ? plDraft.items.reduce((a, it) => a + (Number(it.duration) || 0) * Math.max(1, nSlides(contentById(it.contentId))), 0) : 0;
    const hasFullVideo = plDraft && plDraft.items.some(it => !Number(it.duration) && (contentById(it.contentId) || {}).type === 'video');
    return `
      <h2>Playlists</h2>
      <p class="sub">Une playlist est une suite de contenus diffusés en boucle. Attribuez-la ensuite à un ou plusieurs écrans.</p>
      <div class="pl">
        <div class="panel pllist" style="padding:10px">
          ${S.playlists.map(x => `<div class="it ${x.id === selPl ? 'on' : ''}" data-pl="${x.id}"><span>${esc(x.name)}</span><span class="muted">${x.items.length}</span></div>`).join('')}
          <button class="btn" id="plNew" style="width:100%;margin-top:8px">+ Nouvelle playlist</button>
        </div>
        ${p ? `<div>
          <div class="panel">
            <div class="row">
              <label class="f grow">Nom de la playlist<input type="text" id="plName" value="${esc(plDraft.name)}"></label>
              <div class="row" style="align-self:flex-end">
                <button class="btn" id="plPrev">Aperçu</button>
                <button class="btn danger" id="plDel">Supprimer</button>
                <button class="btn pri" id="plSave">Enregistrer</button>
              </div>
            </div>
            <p class="muted" style="margin:10px 0 0;font-size:13px">
              Durée d'un tour : <strong>${fmtDur(total)}</strong>${hasFullVideo ? ' + durée des vidéos' : ''} ·
              ${usedBy.length ? 'Utilisée par : ' + usedBy.map(s => esc(s.name)).join(', ') : 'Non attribuée à un écran'}
            </p>
          </div>
          <div class="panel">
            <h3>Contenus de la playlist</h3>
            <div class="items">${plDraft.items.length ? plDraft.items.map((it, i) => {
              const c = contentById(it.contentId);
              return `<div class="itm" data-i="${i}">
                <div class="n">${i + 1}</div>${thumb(c, 'mini')}
                <div><strong>${esc(c ? c.name : 'Contenu supprimé')}</strong><div class="muted" style="font-size:12px">${c ? TYPES[c.type] + (c.type === 'slides' ? ' · ' + nSlides(c) + ' diapos' : '') : ''}</div></div>
                <div class="dur"><input type="number" min="0" value="${it.duration}" class="iDur"> s${c && c.type === 'slides' ? ' / diapo' : ''}</div>
                <div class="ops row" style="gap:4px"><button class="btn sm iUp" ${i === 0 ? 'disabled' : ''}>↑</button><button class="btn sm iDn" ${i === plDraft.items.length - 1 ? 'disabled' : ''}>↓</button><button class="btn sm danger iDel">✕</button></div>
              </div>`; }).join('') : '<div class="empty">Playlist vide : cliquez sur un contenu ci-dessous pour l\'ajouter.</div>'}</div>
            <h3 style="margin-top:16px">Ajouter depuis la bibliothèque <span class="muted" style="font-weight:400;font-size:13px">(clic pour ajouter à la fin)</span></h3>
            <div class="lib">${S.contents.map(c => `<div class="li" data-add="${c.id}" title="${esc(c.name)}">${thumb(c, 'mini')}<div class="l">${esc(c.name)}</div></div>`).join('') || '<span class="muted">La bibliothèque est vide (onglet Contenus).</span>'}</div>
            <p class="muted" style="font-size:13px;margin:6px 0 0">Pour une vidéo, une durée de 0 s la lit en entier.</p>
          </div>
        </div>` : '<div class="panel empty">Créez votre première playlist.</div>'}
      </div>`;
  }

  /* ================= ALERTE ================= */
  function viewAlert() {
    const a = S.alert;
    const presets = PRESETS;
    return `
      <h2>Alerte générale</h2>
      <p class="sub">Un message d'alerte s'affiche immédiatement en plein écran sur <strong>tous</strong> les écrans connectés, par-dessus les playlists, jusqu'à ce que vous le leviez.</p>
      ${a ? `<div class="alertOn ${a.level === 'info' ? 'info' : ''}">
          <div class="t"><h3>${esc(a.title)} — diffusée ${ago(a.at)}</h3><div style="white-space:pre-line">${esc(a.message)}</div></div>
          <button class="btn big" id="alClear" style="color:var(--ink)">Lever l'alerte</button></div>` : ''}
      <div class="panel">
        <h3>Modèles rapides</h3>
        <div class="presets">${presets.map((p, i) => `<button class="btn ${p[0] === 'urgence' ? 'danger' : ''}" data-preset="${i}">${esc(p[1])}${p[0] === 'info' ? ' · ' + esc(p[2].slice(0, 26)) + '…' : ''}</button>`).join('')}</div>
        <div class="two" style="display:grid;grid-template-columns:200px 1fr;gap:12px">
          <label class="f">Niveau<select id="alLevel"><option value="urgence">Urgence (rouge clignotant)</option><option value="info">Information (orange)</option></select></label>
          <label class="f">Titre<input type="text" id="alTitle" placeholder="ex. ÉVACUATION"></label>
        </div>
        <label class="f" style="margin-top:10px">Message<textarea id="alMsg" rows="3" placeholder="Consignes à afficher…"></textarea></label>
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn big" id="alSend" style="background:var(--bad);border-color:var(--bad);color:#fff">Diffuser sur tous les écrans</button></div>
      </div>
      <p class="muted" style="font-size:13px">Cet outil complète le signal sonore réglementaire et ne le remplace pas.</p>`;
  }
  const PRESETS = [
    ['urgence', 'ÉVACUATION', 'Exercice d\'évacuation en cours.\nRejoignez calmement le point de rassemblement.'],
    ['urgence', 'CONFINEMENT', 'Mise en sûreté en cours (PPMS).\nRestez dans la salle et suivez les consignes de l\'adulte.'],
    ['info', 'Information', 'Les cours de l\'après-midi sont maintenus.'],
    ['info', 'Rappel', 'Pensez à rendre vos autorisations de sortie.']
  ];

  /* ================= RÉGLAGES ================= */
  function viewSettings() {
    const o = esc(location.origin);
    return `
      <h2>Réglages &amp; aide</h2>
      <p class="sub">Paramètres généraux et mode d'emploi rapide.</p>
      <div class="panel">
        <h3>Établissement</h3>
        <div class="row"><label class="f grow">Nom affiché sur l'horloge<input type="text" id="setName" value="${esc(S.settings.schoolName || '')}"></label>
        <button class="btn pri" id="setSave" style="align-self:flex-end">Enregistrer</button></div>
      </div>
      <div class="panel">
        <h3>Adresses</h3>
        <p>Console d'administration : <code class="url">${o}/admin</code></p>
        <p>À ouvrir sur chaque écran : <code class="url">${o}/</code></p>
        <p class="muted" style="font-size:13px">Les écrans ont seulement besoin d'un accès à Internet (Wi-Fi de l'établissement ou autre). Les modifications arrivent sur les écrans en 10 à 20 secondes.</p>
      </div>
      <div class="panel">
        <h3>Mon mot de passe <span class="muted" style="font-weight:400;font-size:13px">(${esc(S.me.name)} · identifiant « ${esc(S.me.login)} »)</span></h3>
        <div class="row">
          <label class="f grow">Nouveau mot de passe<input type="password" id="pwNew" autocomplete="new-password"></label>
          <label class="f grow">Confirmer<input type="password" id="pwNew2" autocomplete="new-password"></label>
          <button class="btn pri" id="pwSave" style="align-self:flex-end">Changer</button>
        </div>
      </div>
      <div class="panel">
        <h3>Comptes administrateurs</h3>
        <div style="display:flex;flex-direction:column;gap:8px">${S.users.map(u => `
          <div class="row" data-user="${u.id}" style="background:var(--soft);border-radius:8px;padding:8px 12px">
            <div class="grow"><strong>${esc(u.name)}</strong> <span class="muted">· ${esc(u.login)}</span>
              ${u.mustChange ? '<span class="chip" style="cursor:default;padding:1px 8px;font-size:12px;margin-left:6px">mot de passe provisoire</span>' : ''}
              <div class="muted" style="font-size:12px">${u.lastLogin ? 'Dernière connexion ' + ago(u.lastLogin) : 'Jamais connecté'}</div></div>
            ${u.id === S.me.id ? '<span class="muted" style="font-size:13px">vous</span>' : `
            <button class="btn sm" data-ureset>Nouveau mot de passe provisoire</button>
            <button class="btn sm danger" data-udel>Supprimer</button>`}
          </div>`).join('')}</div>
        <h3 style="margin-top:18px;font-size:15px">Ajouter un administrateur</h3>
        <div class="row">
          <label class="f grow">Nom et prénom<input type="text" id="uName" placeholder="ex. Marie Dupont"></label>
          <label class="f" style="width:170px">Identifiant<input type="text" id="uLogin" placeholder="ex. marie" autocapitalize="none" spellcheck="false"></label>
          <label class="f" style="width:190px">Mot de passe provisoire<input type="text" id="uPw" placeholder="8 caractères min." autocomplete="off"></label>
          <button class="btn pri" id="uAdd" style="align-self:flex-end">Créer le compte</button>
        </div>
        <p class="muted" style="font-size:13px;margin-bottom:0">La personne devra choisir son propre mot de passe à sa première connexion.</p>
      </div>
      <div class="panel">
        <h3>Mettre un écran en service</h3>
        <ol style="margin:0;padding-left:20px;line-height:1.8">
          <li>Connecter l'écran (TV connectée, clé Fire TV / Android TV, mini-PC ou Raspberry Pi) à Internet.</li>
          <li>Ouvrir le navigateur et saisir <code class="url">${o}/</code> — un code à 4 chiffres s'affiche.</li>
          <li>Dans l'onglet <strong>Écrans</strong>, saisir ce code et donner un nom à l'écran.</li>
          <li>Choisir sa playlist, son orientation et, si besoin, une programmation horaire.</li>
          <li>Cliquer une fois sur l'écran (ou touche OK de la télécommande) pour passer en plein écran.</li>
        </ol>
        <p class="muted" style="font-size:13px">Astuce : sur clé Android / Fire TV, l'application « Fully Kiosk Browser » ouvre l'adresse automatiquement au démarrage, en plein écran et sans mise en veille.</p>
      </div>`;
  }

  /* ================= Liaisons d'événements ================= */
  function bind() {
    const m = $('#main');
    if (tab === 'screens') {
      renderPending();
      $('#pBtn').onclick = () => run(async () => {
        await api('POST', '/api/screens/pair', { code: $('#pCode').value, name: $('#pName').value, location: $('#pLoc').value });
        await refresh();
      }, 'Écran appairé');
      m.querySelectorAll('[data-cmdall]').forEach(b => b.onclick = () => run(async () => {
        const r = await api('POST', '/api/screens/all/cmd', { cmd: b.dataset.cmdall });
        toast('Commande envoyée à ' + r.sent + ' écran(s) — exécutée sous 20 s');
      }));
      m.querySelectorAll('[data-screen]').forEach(card => {
        const id = card.dataset.screen;
        card.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => run(() => api('POST', `/api/screens/${id}/cmd`, { cmd: b.dataset.cmd }), 'Commande envoyée — exécutée sous 20 s'));
        const cd = card.querySelector('[data-cleardiag]');
        if (cd) cd.onclick = () => run(async () => { await api('POST', `/api/screens/${id}/cmd`, { cmd: 'cleardiag' }); await refresh(); });
        card.querySelector('[data-del-screen]').onclick = async () => {
          if (!(await ask('Retirer cet écran ?', 'Il affichera de nouveau un code d\'appairage.', 'Retirer'))) return;
          run(async () => { await api('DELETE', '/api/screens/' + id); await refresh(); }, 'Écran retiré');
        };
        const bindRule = row => row.querySelector('.rDel').onclick = () => row.remove();
        card.querySelectorAll('.rule').forEach(bindRule);
        card.querySelector('.rAdd').onclick = () => {
          const tmp = document.createElement('div'); tmp.innerHTML = ruleRow();
          const row = tmp.firstElementChild; card.querySelector('.rlist').appendChild(row); bindRule(row);
        };
        card.querySelector('[data-save-screen]').onclick = () => run(async () => {
          const schedules = [...card.querySelectorAll('.rule')].map(r => ({
            id: r.dataset.rule, playlistId: r.querySelector('.rPl').value,
            days: [...r.querySelectorAll('.days input:checked')].map(i => Number(i.value)),
            start: r.querySelector('.rS').value, end: r.querySelector('.rE').value
          }));
          await api('PUT', '/api/screens/' + id, {
            name: card.querySelector('.sName').value, location: card.querySelector('.sLoc').value,
            playlistId: card.querySelector('.sPl').value || null, orientation: Number(card.querySelector('.sOr').value),
            margin: Number(card.querySelector('.sMar').value),
            ticker: card.querySelector('.sTick').value, showClock: card.querySelector('.sClk').checked, schedules
          });
          await refresh();
        }, 'Écran mis à jour');
      });
    }

    if (tab === 'contents') {
      const drop = $('#drop'), file = $('#file');
      drop.onclick = e => { if (e.target === drop || e.target.tagName !== 'INPUT') file.click(); };
      file.onchange = () => { uploadFiles(file.files); file.value = ''; };
      ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));
      m.querySelectorAll('[data-new]').forEach(b => b.onclick = () => {
        const t = b.dataset.new;
        if (t === 'clock') return run(async () => { await api('POST', '/api/contents', { type: 'clock', name: 'Horloge et date', duration: 15 }); await refresh(); }, 'Horloge ajoutée');
        openContent({ type: t, duration: t === 'youtube' ? 60 : t === 'web' ? 30 : 12 });
      });
      m.querySelectorAll('[data-content]').forEach(card => {
        const c = contentById(card.dataset.content);
        card.querySelector('[data-edit]').onclick = () => openContent(c);
        card.querySelector('[data-del]').onclick = async () => {
          const used = S.playlists.filter(p => p.items.some(it => it.contentId === c.id)).map(p => p.name);
          if (!(await ask(`Supprimer « ${c.name} » ?`, used.length ? `Il sera retiré des playlists : ${used.join(', ')}.` : '', 'Supprimer'))) return;
          run(async () => { await api('DELETE', '/api/contents/' + c.id); await refresh(); }, 'Contenu supprimé');
        };
      });
    }

    if (tab === 'playlists') {
      m.querySelectorAll('[data-pl]').forEach(el => el.onclick = () => { selPl = el.dataset.pl; plDraft = null; render(); });
      $('#plNew').onclick = () => run(async () => {
        const p = await api('POST', '/api/playlists', { name: 'Nouvelle playlist' });
        selPl = p.id; plDraft = null; await refresh();
      });
      if (!plDraft) return;
      const syncDur = () => m.querySelectorAll('.itm').forEach(r => { plDraft.items[r.dataset.i].duration = Number(r.querySelector('.iDur').value) || 0; });
      $('#plName').oninput = e => { plDraft.name = e.target.value; };
      m.querySelectorAll('.itm').forEach(r => {
        const i = Number(r.dataset.i);
        r.querySelector('.iUp').onclick = () => { syncDur(); [plDraft.items[i - 1], plDraft.items[i]] = [plDraft.items[i], plDraft.items[i - 1]]; render(); };
        r.querySelector('.iDn').onclick = () => { syncDur(); [plDraft.items[i + 1], plDraft.items[i]] = [plDraft.items[i], plDraft.items[i + 1]]; render(); };
        r.querySelector('.iDel').onclick = () => { syncDur(); plDraft.items.splice(i, 1); render(); };
        r.querySelector('.iDur').onchange = () => { syncDur(); render(); };
      });
      m.querySelectorAll('[data-add]').forEach(el => el.onclick = () => {
        syncDur(); const c = contentById(el.dataset.add);
        plDraft.items.push({ contentId: c.id, duration: c.duration != null ? c.duration : 10 }); render();
      });
      $('#plSave').onclick = () => run(async () => {
        syncDur();
        await api('PUT', '/api/playlists/' + plDraft.id, { name: plDraft.name, items: plDraft.items });
        plDraft = null; await refresh();
      }, 'Playlist enregistrée — les écrans sont mis à jour');
      $('#plPrev').onclick = () => window.open(`/?preview=${encodeURIComponent(plDraft.id)}&token=${encodeURIComponent(token)}`, '_blank');
      $('#plDel').onclick = async () => {
        if (!(await ask(`Supprimer la playlist « ${plDraft.name} » ?`, '', 'Supprimer'))) return;
        run(async () => { await api('DELETE', '/api/playlists/' + plDraft.id); selPl = null; plDraft = null; await refresh(); }, 'Playlist supprimée');
      };
    }

    if (tab === 'alert') {
      m.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
        const p = PRESETS[b.dataset.preset];
        $('#alLevel').value = p[0]; $('#alTitle').value = p[1]; $('#alMsg').value = p[2];
      });
      $('#alSend').onclick = async () => {
        if (!$('#alMsg').value.trim()) return toast('Saisissez un message', true);
        if (!(await ask('Diffuser cette alerte sur TOUS les écrans ?', 'Elle s\'affichera en plein écran dans les 20 secondes, jusqu\'à ce que vous la leviez.', 'Diffuser maintenant'))) return;
        run(async () => {
          await api('POST', '/api/alert', { level: $('#alLevel').value, title: $('#alTitle').value, message: $('#alMsg').value });
          await refresh();
        }, 'Alerte diffusée');
      };
      const cl = $('#alClear');
      if (cl) cl.onclick = () => run(async () => { await api('DELETE', '/api/alert'); await refresh(); }, 'Alerte levée');
    }

    if (tab === 'settings') {
      $('#setSave').onclick = () => run(async () => { await api('PUT', '/api/settings', { schoolName: $('#setName').value }); await refresh(); }, 'Réglages enregistrés');
      const pws = $('#pwSave');
      if (pws) pws.onclick = () => {
        if ($('#pwNew').value !== $('#pwNew2').value) return toast('Les deux saisies sont différentes', true);
        run(async () => { await changePassword($('#pwNew').value); $('#pwNew').value = $('#pwNew2').value = ''; }, 'Mot de passe changé');
      };
      $('#uName').oninput = () => {   // identifiant proposé à partir du prénom
        if ($('#uLogin').dataset.touched) return;
        $('#uLogin').value = ($('#uName').value.trim().split(/\s+/)[0] || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9._-]/g, '');
      };
      $('#uLogin').oninput = () => { $('#uLogin').dataset.touched = '1'; };
      $('#uAdd').onclick = () => run(async () => {
        const u = await api('POST', '/api/users', { name: $('#uName').value, login: $('#uLogin').value, password: $('#uPw').value });
        await refresh();
        toast(`Compte créé : identifiant « ${u.login} »`);
      });
      document.querySelectorAll('[data-user]').forEach(row => {
        const u = S.users.find(x => x.id === row.dataset.user);
        const rs = row.querySelector('[data-ureset]'), dl = row.querySelector('[data-udel]');
        if (rs) rs.onclick = () => {
          const ov = document.createElement('div'); ov.className = 'ov';
          ov.innerHTML = `<div class="modal" style="max-width:420px"><h3>Nouveau mot de passe provisoire</h3>
            <p class="muted" style="margin-top:0">${esc(u.name)} devra le changer à sa prochaine connexion.</p>
            <label class="f">Mot de passe provisoire<input type="text" id="rpw" autocomplete="off"></label>
            <div class="ft"><button class="btn" data-x>Annuler</button><button class="btn pri" data-ok>Enregistrer</button></div></div>`;
          document.body.appendChild(ov); ov.querySelector('#rpw').focus();
          ov.querySelector('[data-x]').onclick = () => ov.remove();
          ov.querySelector('[data-ok]').onclick = () => run(async () => {
            await api('POST', `/api/users/${u.id}/reset`, { password: ov.querySelector('#rpw').value }); ov.remove(); await refresh();
          }, 'Mot de passe provisoire enregistré');
        };
        if (dl) dl.onclick = async () => {
          if (!(await ask(`Supprimer le compte de ${u.name} ?`, 'Cette personne ne pourra plus se connecter à la console.', 'Supprimer'))) return;
          run(async () => { await api('DELETE', '/api/users/' + u.id); await refresh(); }, 'Compte supprimé');
        };
      });
    }
  }

  checkSetup().then(needs => { if (needs) return; if (token) start(); else showLogin(); });
})();
</script>
</body>
</html>
