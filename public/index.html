<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affichage – Écran</title>
<style>

  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
  body.kiosk{cursor:none}
  #root{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0;background:#000}
  .layer{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity .8s ease}
  .layer.on{opacity:1}
  .layer video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .layer video.cover{object-fit:cover}
  /* images en arrière-plan : « contain / cover » fonctionne aussi sur Internet Explorer 11 et les vieilles TV */
  .layer .pic{position:absolute;top:0;right:0;bottom:0;left:0;background:#000 no-repeat center center;background-size:contain}
  .layer .pic.cover{background-size:cover}
  .layer iframe{width:100%;height:100%;border:0;background:#fff}

  /* Annonce texte */
  .txt{position:absolute;top:0;right:0;bottom:0;left:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;padding:7em 9em;box-sizing:border-box}
  .txt .bar{width:12em;height:1.1em;border-radius:1em;margin-bottom:4em}
  .txt h1{font-size:9em;line-height:1.05;margin:0 0 .35em;font-weight:800;letter-spacing:-.01em}
  .txt p{font-size:4.6em;line-height:1.35;margin:0;opacity:.92;white-space:pre-line}

  /* Horloge */
  .clk{position:absolute;top:0;right:0;bottom:0;left:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
       background:radial-gradient(circle at 30% 20%,#28466e,#0b1726 70%)}
  .clk .t{font-size:30em;font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .clk .d{font-size:5.5em;margin-top:.4em;opacity:.9}
  .clk .d::first-letter{text-transform:uppercase}
  #root.full-clock #clock{visibility:hidden}
  .clk .s{font-size:3.4em;margin-top:2.2em;opacity:.6;letter-spacing:.08em;text-transform:uppercase}

  /* Surcouches */
  #clock{position:absolute;top:2.4em;right:2.8em;font-size:3.6em;font-weight:600;padding:.25em .6em;border-radius:.4em;
         background:rgba(0,0,0,.45);font-variant-numeric:tabular-nums;z-index:5;display:none}
  #ticker{position:absolute;left:0;right:0;bottom:0;height:7.5em;background:rgba(10,20,40,.92);z-index:5;overflow:hidden;display:none;
          border-top:.4em solid #f4a261}
  #ticker span{position:absolute;top:50%;left:0;white-space:nowrap;font-size:4em;font-weight:600;padding-left:2em;margin-top:-.65em;line-height:1.3}
  /* l'animation du bandeau est générée par le script (sans variables CSS, pour les vieux navigateurs) */

  #alert{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
         text-align:center;padding:6em;box-sizing:border-box}
  #alert.urgence{background:#b00020;-webkit-animation:pulse 1.6s ease-in-out infinite;animation:pulse 1.6s ease-in-out infinite}
  #alert.info{background:#e76f00}
  #alert h1{font-size:13em;margin:0 0 .3em;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
  #alert p{font-size:6.5em;margin:0;line-height:1.3;white-space:pre-line;max-width:85%}
  @-webkit-keyframes pulse{0%,100%{background:#b00020}50%{background:#7a0016}}
  @keyframes pulse{0%,100%{background:#b00020}50%{background:#7a0016}}

  #pair,#idle{position:absolute;top:0;right:0;bottom:0;left:0;z-index:15;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;
              background:linear-gradient(160deg,#0f2440,#1d3557 60%,#264b73)}
  #pair .lbl{font-size:4em;opacity:.8;margin-bottom:.5em}
  #pair .code{font-size:26em;font-weight:800;letter-spacing:.12em;line-height:1;color:#f4a261;font-variant-numeric:tabular-nums}
  #pair .help{font-size:3.4em;margin-top:1.6em;opacity:.85;line-height:1.5}
  #pair .help b{color:#fff;background:rgba(255,255,255,.12);padding:.1em .4em;border-radius:.3em}
  #idle .n{font-size:7em;font-weight:700}
  #idle .h{font-size:3.4em;opacity:.7;margin-top:.8em}

  #ident{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:rgba(0,0,0,.8)}
  #ident div{font-size:14em;font-weight:800;border:.08em solid #f4a261;padding:.3em .8em;border-radius:.3em;text-align:center}

  #net{position:absolute;left:1.5em;bottom:1.5em;width:2em;height:2em;border-radius:50%;background:#e63946;z-index:40;display:none;
       box-shadow:0 0 0 .4em rgba(230,57,70,.3)}
  #hint{position:fixed;left:0;right:0;margin:0 auto;width:420px;text-align:center;top:1.2em;background:rgba(0,0,0,.7);color:#fff;font-size:15px;padding:8px 16px;
        border-radius:20px;z-index:50;transition:opacity 1s}

</style>
</head>
<body>
<div id="root">
  <div class="layer" id="A"></div>
  <div class="layer" id="B"></div>
  <div id="clock"></div>
  <div id="ticker"><span></span></div>
  <div id="idle"><div class="n"></div><div class="h">Aucune playlist n'est attribuée à cet écran.</div></div>
  <div id="pair">
    <div class="lbl">Code d'appairage de cet écran</div>
    <div class="code">····</div>
    <div class="help">Ouvrez la console <b class="url"></b><br>onglet <b>Écrans</b> et saisissez ce code.</div>
  </div>
  <div id="alert"><h1></h1><p></p></div>
  <div id="ident"><div></div></div>
  <div id="net" title="Connexion au serveur perdue"></div>
</div>
<div id="hint">Cliquez ou appuyez sur OK pour passer en plein écran</div>
