[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"

# Bouton « Deploy to Netlify » : variable demandée lors de l'installation
[template.environment]
  SETUP_CODE = "Code secret exigé pour créer le premier compte administrateur (conservez-le)"
